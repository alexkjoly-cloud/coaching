<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Philippe · Full body</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a; --dark: #111111; --card: #161616; --border: #242424;
    --red: #e63232; --red-dim: rgba(230,50,50,0.10); --red-line: rgba(230,50,50,0.45);
    --gold: #c9a84c; --gold-dim: rgba(201,168,76,0.10);
    --green: #3eb87a; --green-dim: rgba(62,184,122,0.10);
    --white: #f0ede8; --muted: #9a958c; --muted2: #5c5850;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--black); color:var(--white); font-family:'DM Sans',system-ui,sans-serif; font-size:16px; line-height:1.5; min-height:100vh; padding-bottom:40px; }
  button { font-family:inherit; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  .header { padding:24px 16px 16px; border-bottom:1px solid var(--border); display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .eyebrow { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--red); margin-bottom:4px; }
  h1 { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:34px; letter-spacing:0.04em; line-height:1; }
  h1 span { color:var(--red); }
  .cycle-badge { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); text-align:right; line-height:1.4; }
  .cycle-badge strong { color:var(--gold); font-weight:500; display:block; font-size:13px; }

  .week-selector { display:flex; gap:6px; padding:12px; background:var(--dark); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
  .week-selector::-webkit-scrollbar { display:none; }
  .week-btn { flex:0 0 auto; min-width:50px; padding:10px 0 12px; border-radius:2px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.06em; cursor:pointer; background:var(--card); color:var(--muted); border:1px solid var(--border); position:relative; }
  .week-btn.active { background:var(--red-dim); border-color:var(--red-line); color:var(--red); }
  .week-btn.today::after { content:''; position:absolute; left:50%; bottom:4px; width:14px; height:2px; margin-left:-7px; background:var(--gold); }
  .week-btn.has-data { color:var(--white); }
  .week-btn.has-data.active { color:var(--red); }

  .banner { margin:12px 16px 0; padding:12px 14px; border:1px solid var(--border); background:var(--card); border-radius:2px; font-size:14px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .banner b { color:var(--white); font-weight:500; }
  .banner button { padding:8px 12px; border-radius:2px; border:1px solid var(--border); background:var(--dark); color:var(--white); font-size:14px; cursor:pointer; }

  .next-card { margin:14px 16px 0; padding:16px; border:1px solid var(--red-line); background:var(--red-dim); border-radius:2px; }
  .next-card .nc-k { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--red); }
  .next-card .nc-v { font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:0.04em; line-height:1.05; margin-top:2px; }
  .next-card .nc-s { font-size:14px; color:var(--muted); margin-top:4px; }
  .next-card .nc-ok { font-size:14px; color:var(--green); margin-top:6px; }
  .next-card button { margin-top:12px; width:100%; padding:13px 0; border-radius:2px; border:none; background:var(--red); color:#fff; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.08em; cursor:pointer; }

  .tabs { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) minmax(0,1.4fr); gap:6px; padding:14px 16px 0; }
  .tab { padding:10px 4px; border-radius:2px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; text-align:center; position:relative; }
  .tab .t-k { display:block; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.06em; line-height:1.1; overflow-wrap:anywhere; }
  #tab-P .t-k { font-size:19px; }
  .tab .t-s { display:block; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }
  .tab.active { border-color:var(--red-line); background:var(--red-dim); color:var(--red); }
  .tab .t-next { position:absolute; top:-7px; right:-4px; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; background:var(--gold); color:var(--black); padding:1px 5px; border-radius:2px; font-weight:500; }

  .session { display:none; padding:18px 16px 0; }
  .session.visible { display:block; }
  .session-header { margin-bottom:14px; }
  .session-tag { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--red); }
  .session-title { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:0.04em; line-height:1.1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .week-pill { font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); background:var(--gold-dim); padding:3px 8px; border-radius:2px; }
  .session-sub { font-size:14px; color:var(--muted); }

  .warmup { border:1px solid var(--border); border-left:3px solid var(--gold); background:var(--card); padding:14px 16px; border-radius:2px; margin-bottom:14px; }
  .warmup .wu-t { font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .warmup ul { padding-left:18px; display:grid; gap:3px; font-size:15px; }
  .warmup .wu-s { margin-top:8px; font-size:14px; color:var(--muted); }

  .exo-card { border:1px solid var(--border); background:var(--card); border-radius:2px; padding:14px 14px 12px; margin-bottom:12px; }
  .exo-top { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:start; }
  .exo-num { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--muted2); line-height:1.2; }
  .exo-name { font-size:18px; font-weight:500; line-height:1.3; }
  .exo-muscles { font-size:13px; color:var(--gold); margin-top:2px; }
  .exo-pres { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.04em; color:var(--red); white-space:nowrap; line-height:1.2; text-align:right; }
  .exo-pres small { display:block; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; }
  .exo-how { margin-top:10px; font-size:15px; }
  .exo-alt { margin-top:4px; font-size:14px; color:var(--muted); }
  .exo-note { margin-top:8px; font-size:14px; color:var(--gold); }

  .guide { margin-top:12px; border-top:1px solid var(--border); padding-top:10px; display:grid; gap:6px; font-size:14px; }
  .guide .g-row { display:grid; grid-template-columns:118px minmax(0,1fr); gap:8px; }
  .guide .g-k { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); padding-top:2px; }
  .guide .g-v b { font-weight:500; }
  .guide .g-obj .g-v { color:var(--white); }
  .guide .g-up .g-v { color:var(--green); }
  .guide .g-first { color:var(--muted); }

  .col-header, .serie-row { display:grid; grid-template-columns:78px minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:center; }
  .col-header { margin-top:12px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
  .serie-row { margin-top:6px; }
  .serie-num { font-size:14px; color:var(--muted); line-height:1.2; }
  .serie-num small { display:block; font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.08em; }
  .serie-input { width:100%; height:48px; border-radius:2px; border:1px solid var(--border); background:var(--dark); color:var(--white); font-family:'DM Sans',sans-serif; font-size:19px; text-align:center; }
  .serie-input:focus { border-color:var(--red-line); outline:none; }
  .exo-foot { margin-top:10px; display:flex; justify-content:flex-end; }
  .rest-chip { font-size:12px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; padding:8px 12px; border-radius:2px; background:var(--dark); color:var(--muted); border:1px solid var(--border); cursor:pointer; }
  .rest-chip::before { content:'\23F1  '; }

  .note-area { margin-top:6px; }
  .note-label { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .note-input { width:100%; min-height:90px; border-radius:2px; border:1px solid var(--border); background:var(--card); color:var(--white); font-family:'DM Sans',sans-serif; font-size:16px; padding:12px; resize:vertical; }
  .finish-btn { margin-top:14px; width:100%; padding:16px 0; border-radius:2px; border:none; background:var(--red); color:#fff; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.08em; cursor:pointer; }
  .finish-msg { margin-top:10px; font-size:15px; color:var(--green); text-align:center; min-height:1.5em; }

  .principes { padding:18px 16px 0; }
  .principes h2 { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:32px; letter-spacing:0.04em; line-height:1.1; }
  .p-intro { color:var(--muted); font-size:15px; margin-top:4px; }
  .p-card { border:1px solid var(--border); background:var(--card); border-radius:2px; padding:14px 16px; margin-top:12px; }
  .p-card h3 { font-size:17px; font-weight:500; margin-bottom:6px; }
  .p-card p + p { margin-top:8px; }
  .p-card ul { padding-left:20px; margin-top:6px; display:grid; gap:2px; }
  .p-card.attention { border-color:var(--red-line); background:var(--red-dim); }
  .p-card.attention h3 { color:var(--red); }

  #rest-chrono { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(160%); z-index:300; width:min(320px, calc(100vw - 28px)); background:var(--dark); border:1px solid var(--border); border-radius:4px; padding:12px 14px 14px; box-shadow:0 10px 30px rgba(0,0,0,0.6); transition:transform .25s ease, opacity .25s ease; opacity:0; }
  #rest-chrono.visible { transform:translateX(-50%) translateY(0); opacity:1; }
  .rc-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .rc-label { font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
  .rc-close { background:none; border:none; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; padding:0 2px; }
  .rc-time { font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:0.04em; text-align:center; font-variant-numeric:tabular-nums; color:var(--white); line-height:1; margin-bottom:12px; }
  .rc-time.running { color:var(--red); }
  .rc-time.done { color:var(--green); }
  .rc-controls { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .rc-btn { padding:12px 0; border-radius:2px; border:1px solid var(--border); font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.08em; cursor:pointer; background:transparent; color:var(--white); }
  .rc-btn.primary { background:var(--red); border-color:var(--red); color:#fff; }

  @media (prefers-reduced-motion: reduce) { #rest-chrono { transition:none; } }
</style>
<meta name="author" content="Alexandre Joly">
</head>
<body>

<header class="header">
  <div>
    <div class="eyebrow">Programme · 12 semaines</div>
    <h1>PHILIPPE<span>.</span></h1>
  </div>
  <div class="cycle-badge">Full body<strong>A · B · C</strong></div>
</header>

<nav class="week-selector" id="week-selector" aria-label="Semaines"></nav>
<div class="banner" id="week-banner" hidden></div>
<section class="next-card" id="next-card" aria-live="polite"></section>
<nav class="tabs" id="tabs" aria-label="Séances"></nav>
<main id="sessions-container"></main>

<div id="rest-chrono">
  <div class="rc-top">
    <span class="rc-label">Repos · environ 2 min</span>
    <button class="rc-close" onclick="restChrono.hide()" aria-label="Fermer">×</button>
  </div>
  <div class="rc-time" id="rc-time">0:00</div>
  <div class="rc-controls">
    <button class="rc-btn primary" id="rc-toggle" onclick="restChrono.toggle()">Départ</button>
    <button class="rc-btn" onclick="restChrono.reset()">Remise à zéro</button>
  </div>
</div>

<script>
const SYNC_URL = "https://script.google.com/macros/s/AKfycbwk80wp47P-Yz0EpFcBj7vsWHWjCWssV7zNV4Og4TrqQtcSTv5u7kHVVsnXe0Opluj_/exec";
const CLIENT_ID = "philippe";
const K = cle => CLIENT_ID + '-' + cle;

// Semaine 1 = la semaine du lundi 2 novembre 2026. La semaine affichée se calcule
// toute seule avec la date : il n'a jamais à la choisir.
const DEBUT = new Date('2026-11-02T00:00:00+01:00');
const NB_SEMAINES = 12;

// Trois séances full body faites à la suite, sans jour fixe : A, puis B, puis C, puis A.
// series = lignes affichées, min = séries à faire (au-delà, la série est en option).
// pas = cran de la charge pour arrondir la montée en charge.
const ORDRE = ['A','B','C'];
const PROGRAMME = {
  A: {
    resume: 'Dos · pectoraux · cuisses · épaules',
    exos: [
      { nom:'Tirage horizontal, coudes écartés', muscles:'Haut du dos · arrière des épaules',
        comment:"Assis face à la poulie, tu tires les poignées vers ta poitrine en écartant les coudes.",
        ou:"Ou face pull : debout, tu tires la corde vers ton visage.",
        series:3, min:3, reps:[10,15], pas:2.5 },
      { nom:'Développé à la machine', muscles:'Pectoraux',
        comment:"Assis ou allongé, tu pousses les poignées devant toi jusqu'à avoir les bras presque tendus, puis tu reviens doucement.",

        series:3, min:3, reps:[8,12], pas:2.5 },

        comment:"Assis, le rouleau sur le bas des tibias : tu tends les jambes, puis tu redescends doucement.",
        note:"Charge légère, pour ménager tes genoux. La 3e série seulement s'ils vont bien.",

      { nom:'Adducteurs à la machine', muscles:'Intérieur des cuisses',
        comment:"Assis, les coussins contre l'intérieur des genoux : tu serres les jambes, puis tu les rouvres doucement.",
        note:"La 2e série si tu te sens bien.",

      { nom:'Tirage vertical, prise large', muscles:'Dos',
        comment:"Assis, mains écartées, paumes vers l'avant : tu tires la barre jusqu'en haut de ta poitrine, puis tu la laisses remonter jusqu'à avoir les bras tendus.",
        series:3, min:3, reps:[10,15], pas:2.5 },
      { nom:'Élévations latérales', muscles:'Épaules',
        comment:"Debout, un haltère dans chaque main : tu lèves les bras sur les côtés jusqu'à hauteur des épaules, puis tu redescends doucement.",
        series:2, min:2, reps:[12,15], pas:1 },
    ]
  },
  B: {
    resume: 'Arrière des cuisses · dos · pectoraux · fessiers · bras',
    exos: [
      { nom:'Leg curl, assis ou couché', muscles:'Arrière des cuisses',
        comment:"Assis ou couché sur le ventre, selon la machine : le rouleau contre l'arrière des chevilles, tu plies les jambes, puis tu reviens doucement.",
        series:3, min:3, reps:[10,15], pas:2.5 },
      { nom:'Tirage horizontal à la poulie, prise serrée', muscles:'Milieu du dos',
        comment:"Assis face à la poulie : tu tires la poignée vers ton ventre, les coudes le long du corps, puis tu tends les bras doucement.",
        ou:"Ou rowing à la machine, avec un appui pour la poitrine.",
        series:3, min:3, reps:[10,15], pas:2.5 },
      { nom:'Écarté à la machine', muscles:'Pectoraux',
        comment:"Assis, les bras ouverts : tu ramènes les poignées devant toi comme pour serrer quelqu'un dans tes bras, puis tu rouvres doucement.",
        series:2, min:2, reps:[10,15], pas:2.5 },
      { nom:'Abducteurs à la machine', muscles:'Fessiers (côté des hanches)',
        comment:"Assis, les coussins contre l'extérieur des genoux : tu écartes les jambes, puis tu les refermes doucement.",
        series:2, min:2, reps:[12,15], pas:2.5 },
      { nom:'Curl biceps', muscles:'Biceps',
        comment:"Un haltère dans chaque main : tu plies les bras en gardant les coudes collés au corps, puis tu redescends doucement.",
        ou:"Ou à la machine à biceps.",
        series:2, min:2, reps:[10,15], pas:1 },
      { nom:'Extension triceps à la poulie', muscles:'Triceps (arrière des bras)',
        comment:"Debout face à la poulie haute, coudes collés au corps : tu tends les bras vers le bas, puis tu remontes doucement.",
        ou:"Avec la corde ou la barre, comme tu préfères.",
        series:2, min:2, reps:[10,15], pas:2.5 },
    ]
  },
  C: {
    resume: 'Cuisses · dos · pectoraux · mollets · abdos',
    exos: [
      { nom:'Presse à cuisses', muscles:'Cuisses · fessiers',
        comment:"Assis, le dos bien calé, les pieds hauts sur la plateforme : tu pousses jusqu'à avoir les jambes presque tendues, sans bloquer les genoux.",
        note:"Tu ne descends que tant que tes genoux sont à l'aise. La 3e série seulement s'ils vont bien.",

      { nom:'Tirage vertical, prise serrée', muscles:'Dos',

        comment:"Comme dans la séance A : tu pousses les poignées devant toi jusqu'à avoir les bras presque tendus, puis tu reviens doucement. Ici un peu plus léger, pour faire 10 à 15 répétitions.",
        ou:"Ou, si tu veux essayer : développé épaules à la machine, tu pousses les poignées au-dessus de ta tête.",
        series:2, min:2, reps:[10,15], pas:2.5 },
      { nom:'Tirage horizontal, coudes écartés', muscles:'Haut du dos · arrière des épaules',
        comment:"Assis face à la poulie, tu tires les poignées vers ta poitrine en écartant les coudes.",
        ou:"Ou face pull : debout, tu tires la corde vers ton visage.",
        series:2, min:2, reps:[10,15], pas:2.5 },
      { nom:'Mollets à la machine', muscles:'Mollets',
        comment:"Tu montes sur la pointe des pieds le plus haut possible, puis tu redescends les talons bien bas.",

        series:2, min:2, reps:[12,15], pas:2.5 },
      { nom:'Crunch à la machine', muscles:'Abdominaux',
        comment:"Assis, tu enroules le buste vers l'avant en serrant le ventre, puis tu reviens doucement.",

    ]

};

const ECHAUFFEMENT = `<div class="warmup">
  <div class="wu-t">Échauffement · 5 à 10 min</div>
  <ul>
    <li>5 min de vélo, tranquille</li>
    <li>10 grands cercles de bras vers l'arrière</li>
    <li>10 rotations du buste, debout</li>
    <li>10 balanciers de jambe d'avant en arrière, de chaque côté, en te tenant</li>
  </ul>
  <div class="wu-s">Puis, avant chaque exercice, ta montée en charge (calculée sous l'exercice).</div>
</div>`;

const PRINCIPES = `<section class="principes session" id="session-P">
  <h2>Les principes</h2>
  <p class="p-intro">Lis-les une fois en entier avant ta première séance. Ils sont simples, et c'est eux qui te feront progresser.</p>
  <div class="p-card"><h3>La séance suivante, c'est la suivante</h3>
    <p>Tu fais les séances dans l'ordre : A, puis B, puis C, puis de nouveau A. Pas de jour fixe : tu y vas quand tu peux, et l'appli t'ouvre directement la bonne séance.</p>
    <p>Vise 2 à 3 séances par semaine, avec au moins un jour de repos entre deux.</p></div>
  <div class="p-card"><h3>L'échauffement</h3>
    <p>5 à 10 minutes de mobilité avant de commencer. Le détail est en haut de chaque séance.</p></div>
  <div class="p-card"><h3>La montée en charge, avant chaque exercice</h3>
    <p>À chaque exercice, tu montes la charge progressivement. Ce sont des séries d'échauffement : tu ne dois pas te fatiguer.</p>
    <p>Exemple : ta série effective (celle qui compte : la 1re, la 2e et la 3e) est à 50 kg. Ta montée sera par exemple :</p>
    <ul><li>25 kg × 12 (la moitié de ta charge)</li><li>35 kg × 8 (environ 70 %)</li><li>42,5 kg × 6 (environ 85 %)</li></ul>
    <p>Ça te permet de commencer ta première série effective sans être fatigué et en étant chaud. Ces séries ne comptent pas dans tes séries effectives. L'appli te calcule ta montée à partir de ta charge de la dernière fois.</p></div>
  <div class="p-card"><h3>L'objectif de répétitions</h3>
    <p>Chaque exercice a une fourchette, par exemple 8 à 12 répétitions. Les premières fois ce sera facile, le temps d'apprendre à connaître ton corps : par exemple 3 × 12.</p>
    <p>Quand ça se compliquera, tu seras plutôt vers 12, puis 10, puis 8. L'objectif : atteindre 12 partout avant d'augmenter la charge.</p></div>
  <div class="p-card"><h3>Jusqu'où aller dans une série</h3>
    <p>Les dernières répétitions doivent être dures. Tu t'arrêtes quand la suivante serait mal faite.</p></div>
  <div class="p-card"><h3>Note tout</h3>
    <p>Ta charge et ton nombre de répétitions, à chaque série, à chaque séance. Pas d'inquiétude si tu fais moins que la dernière fois, ça arrive.</p>
    <p>Quand un exercice te laisse le choix entre deux machines, prends-en une et garde la même d'une fois sur l'autre : sinon tes chiffres ne se comparent plus.</p></div>
  <div class="p-card attention"><h3>Attention</h3>
    <p>Même si tu te sens plus fort que les fois précédentes, tu n'augmentes la charge <b>que si</b> tu as atteint le haut de la fourchette à <b>chaque</b> série. Et quand tu montes, toutes tes séries passent à la nouvelle charge.</p></div>
  <div class="p-card"><h3>Le repos</h3>
    <p>Environ 2 minutes entre deux séries. Le bouton « Repos » sous chaque exercice lance le chrono.</p></div>
  <div class="p-card"><h3>Une douleur n'est pas une fatigue</h3>
    <p>Les muscles qui brûlent, c'est normal. Une articulation qui fait mal (genou, épaule, dos), non : tu arrêtes l'exercice et tu le notes. Si ça revient, on en parle et tu vas voir un médecin ou un kiné.</p></div>
  <div class="p-card"><h3>La durée</h3>
    <p>Compte environ 1 h 15 par séance. Pas besoin de dépasser 2 heures.</p></div>
</section>`;

let currentWeek = 1;
let currentTab = 'A';

function lire(cle){ try{ return localStorage.getItem(K(cle)); }catch(e){ return null; } }
function ecrire(cle,v){ try{ localStorage.setItem(K(cle), v); }catch(e){} }
function getKey(s,exoIdx,serie,field,week){ return `${s}-e${exoIdx}-s${serie}-${field}-w${week}`; }
function num(v){ const x=parseFloat(String(v||'').replace(',','.')); return isNaN(x)?null:x; }
function fr(x){ return String(Math.round(x*100)/100).replace('.',','); }

function semaineDuJour(){
  const w = Math.floor((Date.now()-DEBUT.getTime())/(7*24*3600*1000))+1;
  return Math.min(Math.max(w,1), NB_SEMAINES);
}
function programmeFini(){ return Date.now() >= DEBUT.getTime()+NB_SEMAINES*7*24*3600*1000; }

/* ===== Synchronisation vers la Sheet ===== */
let syncStatusTimer=null;
function showSyncStatus(ok){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='position:fixed;bottom:12px;right:12px;z-index:200;font-size:11px;letter-spacing:0.05em;padding:6px 12px;border-radius:20px;font-family:DM Sans,sans-serif;transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(el);
  }
  if(ok){ el.textContent='✓ Enregistré'; el.style.background='rgba(62,184,122,0.15)'; el.style.color='#3eb87a'; }
  else { el.textContent='⟳ Hors-ligne (gardé sur ton téléphone)'; el.style.background='rgba(201,168,76,0.15)'; el.style.color='#c9a84c'; }
  el.style.opacity='1';
  clearTimeout(syncStatusTimer);
  syncStatusTimer=setTimeout(()=>{ el.style.opacity='0'; },1800);
}
function syncToCloud(payload){
  if(!SYNC_URL) return;
  fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>{ showSyncStatus(true); }).catch(()=>{ showSyncStatus(false); });
}
const _syncTimers = {};
function syncFieldDebounced(timerKey, payload){
  clearTimeout(_syncTimers[timerKey]);
  _syncTimers[timerKey] = setTimeout(()=>{ syncToCloud(payload); }, 600);
}
function syncField(session,exoIdx,exoName,serie,field,value,week){
  const timerKey = `${session}-e${exoIdx}-s${serie}-${field}-w${week}`;
  syncFieldDebounced(timerKey, {client:CLIENT_ID,type:'perf',week:week,session:session,exo:exoName,serie:serie,field:field,value:value,ts:new Date().toISOString()});
}

/* ===== Construction ===== */
function buildWeekSelector(){
  const today=semaineDuJour();
  let html='';
  for(let w=1;w<=NB_SEMAINES;w++){
    html+=`<button class="week-btn${w===today?' today':''}" data-week="${w}" onclick="switchWeek(${w})">S${w}</button>`;
  }
  document.getElementById('week-selector').innerHTML=html;
}

function buildTabs(){
  let html='';
  ORDRE.forEach(id=>{ html+=`<button class="tab" id="tab-${id}" onclick="switchTab('${id}')"><span class="t-s">Séance</span><span class="t-k">${id}</span></button>`; });
  html+=`<button class="tab" id="tab-P" onclick="switchTab('P')"><span class="t-s">À lire</span><span class="t-k">Principes</span></button>`;
  document.getElementById('tabs').innerHTML=html;
}

function buildSessions(){
  let html='';
  ORDRE.forEach(sid=>{
    const s=PROGRAMME[sid];
    html+=`<section class="session" id="session-${sid}">
      <div class="session-header">
        <div class="session-tag">Full body</div>
        <div class="session-title">Séance ${sid}<span class="week-pill" id="pill-${sid}">Semaine 1</span></div>
        <div class="session-sub">${s.resume} · environ 1 h 15</div>
      </div>
      ${ECHAUFFEMENT}`;
    s.exos.forEach((exo,ei)=>{
      const nbTxt = exo.min<exo.series ? `${exo.min} à ${exo.series}` : `${exo.series}`;
      html+=`<div class="exo-card">
        <div class="exo-top">
          <div class="exo-num">${String(ei+1).padStart(2,'0')}</div>
          <div><div class="exo-name">${exo.nom}</div><div class="exo-muscles">${exo.muscles}</div></div>
          <div class="exo-pres">${nbTxt} × ${exo.reps[0]}-${exo.reps[1]}<small>séries × répétitions</small></div>
        </div>
        <p class="exo-how">${exo.comment}</p>
        ${exo.ou?`<p class="exo-alt">${exo.ou}</p>`:''}
        ${exo.note?`<p class="exo-note">${exo.note}</p>`:''}
        <div class="guide" id="guide-${sid}-e${ei}"></div>
        <div class="col-header"><div></div><div>Charge (kg)</div><div>Répétitions</div></div>`;
      const en = exo.nom.replace(/'/g,"\\'");
      for(let n=1;n<=exo.series;n++){
        html+=`<div class="serie-row">
          <div class="serie-num">Série ${n}${n>exo.min?'<small>en option</small>':''}</div>
          <input type="text" inputmode="decimal" autocomplete="off" class="serie-input" placeholder="—" aria-label="Série ${n}, charge en kilos" id="${sid}-e${ei}-s${n}-kg" oninput="save('${sid}',${ei},'${en}',${n},'kg',this.value)">
          <input type="text" inputmode="numeric" autocomplete="off" class="serie-input" placeholder="—" aria-label="Série ${n}, répétitions" id="${sid}-e${ei}-s${n}-reps" oninput="save('${sid}',${ei},'${en}',${n},'reps',this.value)">
        </div>`;
      }
      html+=`<div class="exo-foot"><button class="rest-chip" onclick="restChrono.startFor()">Repos</button></div></div>`;
    });
    html+=`<div class="note-area"><div class="note-label">Notes de séance · <span id="notelabel-${sid}">semaine 1</span></div>
        <textarea class="note-input" id="note-${sid}" placeholder="Une douleur, une machine prise, un exercice changé, un ressenti : note-le ici." oninput="saveNote('${sid}',this.value)"></textarea></div>
      <button class="finish-btn" onclick="finir('${sid}')">J'ai fini ma séance</button>
      <div class="finish-msg" id="finish-${sid}"></div>
    </section>`;
  });
  document.getElementById('sessions-container').innerHTML=html+PRINCIPES;
}

/* ===== Saisie ===== */
function save(session,exoIdx,exoName,serie,field,value){
  ecrire(getKey(session,exoIdx,serie,field,currentWeek),value);
  if(String(value).trim()!==''){
    ecrire('derniere',session); ecrire('derniere-ts',String(Date.now())); ecrire('terminee','0');
  }
  syncField(session,exoIdx,exoName,serie,field,value,currentWeek);
  updateWeekFills();
}
function saveNote(session,value){
  ecrire(`${session}-note-w${currentWeek}`,value);
  syncFieldDebounced(`note-${session}-w${currentWeek}`, {client:CLIENT_ID,type:'note',session:session,week:currentWeek,value:value,ts:new Date().toISOString()});
}

function loadAll(){
  ORDRE.forEach(sid=>{
    PROGRAMME[sid].exos.forEach((exo,ei)=>{
      for(let n=1;n<=exo.series;n++){
        ['kg','reps'].forEach(f=>{
          const el=document.getElementById(`${sid}-e${ei}-s${n}-${f}`);
          if(el) el.value=lire(getKey(sid,ei,n,f,currentWeek))||'';
        });
      }
      majGuide(sid,ei);
    });
    const noteEl=document.getElementById(`note-${sid}`);
    if(noteEl) noteEl.value=lire(`${sid}-note-w${currentWeek}`)||'';
    const pill=document.getElementById(`pill-${sid}`); if(pill) pill.textContent=`Semaine ${currentWeek}`;
    const nl=document.getElementById(`notelabel-${sid}`); if(nl) nl.textContent=`semaine ${currentWeek}`;
  });
  updateWeekFills();
}

/* ===== La dernière fois, la montée en charge, l'objectif du jour ===== */
function derniereFois(sid,ei){
  const exo=PROGRAMME[sid].exos[ei];
  for(let w=currentWeek-1;w>=1;w--){
    const series=[];
    for(let n=1;n<=exo.series;n++){
      const kg=num(lire(getKey(sid,ei,n,'kg',w))), reps=num(lire(getKey(sid,ei,n,'reps',w)));
      if(reps!==null) series.push({kg,reps});
    }
    if(series.length) return {w,series};
  }
  return null;
}
function arrondir(x,pas){ return Math.round(x/pas)*pas; }
function montee(charge,pas){
  const paliers=[[0.5,12],[0.7,8],[0.85,6]];
  const out=[]; let avant=null;
  paliers.forEach(([p,r])=>{
    const kg=arrondir(charge*p,pas);
    if(kg>0 && kg!==avant && kg<charge){ out.push(`${fr(kg)} kg × ${r}`); avant=kg; }
  });
  return out;
}
function majGuide(sid,ei){
  const el=document.getElementById(`guide-${sid}-e${ei}`); if(!el) return;
  const exo=PROGRAMME[sid].exos[ei];
  const d=derniereFois(sid,ei);
  if(!d){
    el.innerHTML=`<div class="g-first">Première fois : prends léger et fais ${exo.reps[0] <= 12 && exo.reps[1] >= 12 ? 12 : exo.reps[0]} répétitions faciles à chaque série. Tu apprends le geste et tu trouves ta charge.</div>`;
    return;
  }
  const haut=exo.reps[1];
  const charges=d.series.map(s=>s.kg).filter(k=>k!==null);
  const ref = charges.length ? charges[0] : null;
  const memeCharge = charges.length===d.series.length && charges.every(k=>k===ref);
  const tousEnHaut = d.series.length>=exo.min && d.series.every(s=>s.reps>=haut);
  const fait = d.series.map(s=>`${s.kg!==null?fr(s.kg):'?'} × ${fr(s.reps)}`).join(' · ');
  let objectif, cls='g-obj';
  if(ref===null){
    objectif=`Note ta charge à chaque série, sinon je ne peux pas te dire quoi faire.`;
  } else if(tousEnHaut && memeCharge){
    objectif=`Tu as fait ${haut} à chaque série : <b>monte la charge</b> du plus petit cran possible, sur toutes tes séries.`; cls='g-up';
  } else if(!memeCharge){
    objectif=`Tes charges changeaient d'une série à l'autre. Aujourd'hui, garde <b>${fr(ref)} kg</b> sur toutes tes séries.`;
  } else {
    objectif=`Garde <b>${fr(ref)} kg</b> et essaie de faire une répétition de plus sur au moins une série.`;
  }
  const m = ref!==null ? montee(ref,exo.pas) : [];
  el.innerHTML =
      (m.length?`<div class="g-row"><span class="g-k">Montée</span><span class="g-v">${m.join(' · ')}</span></div>`:'')
    + `<div class="g-row"><span class="g-k">La dernière fois</span><span class="g-v">${fait} <span style="color:var(--muted)">(semaine ${d.w})</span></span></div>`
    + `<div class="g-row ${cls}"><span class="g-k">Aujourd'hui</span><span class="g-v">${objectif}</span></div>`;
}

/* ===== Semaines ===== */
function weekHasData(w){
  return ORDRE.some(sid=>PROGRAMME[sid].exos.some((exo,ei)=>{
    for(let n=1;n<=exo.series;n++){ if(lire(getKey(sid,ei,n,'kg',w)) || lire(getKey(sid,ei,n,'reps',w))) return true; }
    return false;
  }));
}
function updateWeekFills(){
  document.querySelectorAll('.week-btn').forEach(btn=>{
    btn.classList.toggle('has-data', weekHasData(parseInt(btn.dataset.week,10)));
  });
}
function switchWeek(week){
  currentWeek=week;
  document.querySelectorAll('.week-btn').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.week,10)===week));
  const btn=document.querySelector(`.week-btn[data-week="${week}"]`);
  if(btn && btn.scrollIntoView) btn.scrollIntoView({block:'nearest', inline:'center'});
  majBanniere();
  loadAll();
}
function majBanniere(){
  const el=document.getElementById('week-banner');
  const today=semaineDuJour();
  if(programmeFini()){
    el.innerHTML=`<span><b>Tes 12 semaines sont terminées.</b> On fait le point ensemble pour la suite.</span>`;
    el.hidden=false;
  } else if(currentWeek!==today){
    el.innerHTML=`<span>Tu regardes la <b>semaine ${currentWeek}</b>. Ta semaine en cours est la ${today}.</span><button onclick="switchWeek(${today})">Revenir à la semaine ${today}</button>`;
    el.hidden=false;
  } else { el.hidden=true; el.innerHTML=''; }
}

/* ===== Séance suivante ===== */
function etatRotation(){
  const derniere=lire('derniere');
  if(!derniere || !PROGRAMME[derniere]) return {prochaine:'A', enCours:null, derniere:null};
  const ts=parseInt(lire('derniere-ts')||'0',10);
  const finie = lire('terminee')==='1' || (Date.now()-ts) > 3*3600*1000;
  const suivante = ORDRE[(ORDRE.indexOf(derniere)+1)%ORDRE.length];
  return finie ? {prochaine:suivante, enCours:null, derniere, ts} : {prochaine:suivante, enCours:derniere, derniere, ts};
}
function jourFr(ts){ return new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }
function majCarteSuivante(msgOk){
  const e=etatRotation();
  const el=document.getElementById('next-card');
  if(e.enCours){
    el.innerHTML=`<div class="nc-k">Séance en cours</div><div class="nc-v">Séance ${e.enCours}</div>
      <div class="nc-s">Reprends où tu en étais.</div>
      <button onclick="switchTab('${e.enCours}')">Continuer la séance ${e.enCours}</button>`;
  } else {
    const sous = e.derniere ? `La dernière fois, tu as fait la séance ${e.derniere}, ${jourFr(e.ts)}.` : `Tu commences par la séance A.`;
    el.innerHTML=`<div class="nc-k">Ta prochaine séance</div><div class="nc-v">Séance ${e.prochaine}</div>
      <div class="nc-s">${sous}</div>${msgOk?`<div class="nc-ok">${msgOk}</div>`:''}
      <button onclick="switchTab('${e.prochaine}')">Commencer la séance ${e.prochaine}</button>`;
  }
  document.querySelectorAll('.t-next').forEach(x=>x.remove());
  const cible=document.getElementById(`tab-${e.enCours||e.prochaine}`);
  if(cible) cible.insertAdjacentHTML('beforeend', `<span class="t-next">${e.enCours?'En cours':'À faire'}</span>`);
}
function finir(sid){
  const noteEl=document.getElementById(`note-${sid}`);
  if(noteEl) syncToCloud({client:CLIENT_ID,type:'note',session:sid,week:currentWeek,value:noteEl.value,ts:new Date().toISOString()});
  ecrire('derniere',sid); ecrire('derniere-ts',String(Date.now())); ecrire('terminee','1');
  const suivante=ORDRE[(ORDRE.indexOf(sid)+1)%ORDRE.length];
  const msg=document.getElementById(`finish-${sid}`);
  if(msg) msg.textContent=`Séance ${sid} notée. La prochaine fois : séance ${suivante}.`;
  majCarteSuivante(`Bien joué. Séance ${sid} notée.`);
}

function switchTab(id){
  currentTab=id;
  document.querySelectorAll('.session').forEach(s=>s.classList.remove('visible'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const sec=document.getElementById(`session-${id}`); if(sec) sec.classList.add('visible');
  const tab=document.getElementById(`tab-${id}`); if(tab) tab.classList.add('active');
  const tabs=document.getElementById('tabs');
  if(tabs && window.scrollY > tabs.offsetTop) window.scrollTo(0, tabs.offsetTop-8);
}

buildWeekSelector();
buildTabs();
buildSessions();
switchWeek(semaineDuJour());
majCarteSuivante();
(function(){ const e=etatRotation(); switchTab(e.enCours||e.prochaine); })();
</script>

<script>
/* ================= CHRONOMÈTRE DE REPOS ================= */
/* Basé sur l'horloge et mémorisé : il survit au passage en arrière-plan
   et au rechargement de la page. Il passe au vert à 2 minutes. */
const restChrono = (function(){
  const LS_KEY = CLIENT_ID+'-rest-chrono';
  const CIBLE = 120;
  let elapsed=0, running=false, tick=null, startStamp=0, baseElapsed=0;

  const box = () => document.getElementById('rest-chrono');
  const timeEl = () => document.getElementById('rc-time');
  const toggleBtn = () => document.getElementById('rc-toggle');
  const isVisible = () => { const b=box(); return !!(b && b.classList.contains('visible')); };
  function fmt(s){ const m=Math.floor(s/60); const r=s%60; return m+':'+String(r).padStart(2,'0'); }
  function persist(){
    try {
      if(running || elapsed>0 || baseElapsed>0) localStorage.setItem(LS_KEY, JSON.stringify({running, startStamp, baseElapsed, visible:isVisible()}));
      else localStorage.removeItem(LS_KEY);
    } catch(e){}
  }
  function render(){
    const t=timeEl(); if(!t) return;
    t.textContent = fmt(elapsed);
    t.classList.toggle('running', running && elapsed<CIBLE);
    t.classList.toggle('done', elapsed>=CIBLE);
  }
  function recompute(){ if(running) elapsed = baseElapsed + Math.round((Date.now()-startStamp)/1000); }
  function loop(){ recompute(); render(); }
  function startTick(){ clearInterval(tick); tick=setInterval(loop, 250); }
  return {
    open(){ box().classList.add('visible'); persist(); },
    startFor(){
      this.open();
      elapsed=0; baseElapsed=0; startStamp=Date.now(); running=true;
      toggleBtn().textContent='Stop';
      render(); startTick(); persist();
    },
    toggle(){
      if(running){
        running=false; clearInterval(tick); tick=null;
        recompute(); baseElapsed=elapsed;
        toggleBtn().textContent='Reprendre';
        render(); persist();
      } else {
        running=true; startStamp=Date.now();
        toggleBtn().textContent='Stop';
        startTick(); render(); persist();
      }
    },
    reset(){
      running=false; clearInterval(tick); tick=null;
      elapsed=0; baseElapsed=0;
      toggleBtn().textContent='Départ';
      render(); persist();
    },
    hide(){ box().classList.remove('visible'); persist(); },
    sync(){ if(running){ recompute(); render(); if(!tick) startTick(); } },
    restore(){
      let s=null; try { s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); } catch(e){}
      if(!s) return;
      running=!!s.running; baseElapsed=s.baseElapsed||0; startStamp=s.startStamp||Date.now();
      if(running){
        recompute(); toggleBtn().textContent='Stop';
        if(s.visible) box().classList.add('visible');
        render(); startTick();
      } else if(baseElapsed>0){
        elapsed=baseElapsed; toggleBtn().textContent='Reprendre';
        if(s.visible) box().classList.add('visible');
        render();
      }
    }
  };
})();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ restChrono.sync(); majCarteSuivante(); } });
window.addEventListener('pageshow', ()=>restChrono.sync());
restChrono.restore();
</script>
