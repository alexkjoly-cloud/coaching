<title>Tableau de bord des coachés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap">

<style>
:root{
  --black:#0a0908; --dark:#100e0d; --card:#151211; --card2:#1b1716;
  --border:#241e1d; --line:#181312;
  --ink:#f1eee8; --ink2:#877c74; --ink3:#4b423e;
  --red:#e63232; --red-dim:rgba(230,50,50,0.10);
  --s1:#e63232; --s2:#4196df; --s3:#ad8d2b; --s4:#02a894; --s5:#997cdc; --s6:#2baa6d;
  --ok:#2baa6d; --warn:#ad8d2b; --bad:#e63232;
  --ok-dim:rgba(43,170,109,0.12); --warn-dim:rgba(173,141,43,0.12);
  --mono:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--black); color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,sans-serif; font-weight:300;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:26px 18px 70px;}
h1,h2,h3,.num{font-family:'Bebas Neue','DM Sans',sans-serif; font-weight:400; letter-spacing:0.04em;}
.eyebrow{font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink3); font-weight:500;}
.tnum{font-variant-numeric:tabular-nums;}

/* En-tête */
header{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap;
  padding-bottom:16px; border-bottom:1px solid var(--border);}
h1{font-size:34px; line-height:1; margin:4px 0 0;}
h1 .dot{color:var(--red);}
.hsub{font-size:12px; color:var(--ink2); margin-top:5px;}

/* Rail clients */
.rail{display:flex; gap:7px; overflow-x:auto; padding:16px 0 4px; scrollbar-width:thin;}
.cbtn{flex:0 0 auto; display:flex; align-items:center; gap:8px; cursor:pointer;
  background:var(--card); border:1px solid var(--border); border-radius:5px;
  padding:9px 14px 9px 11px; color:var(--ink2); font-family:inherit; font-size:13px;
  transition:border-color .18s, color .18s, background .18s;}
.cbtn:hover{border-color:var(--ink3); color:var(--ink);}
.cbtn[aria-pressed="true"]{background:var(--red-dim); border-color:rgba(230,50,50,0.45); color:var(--ink);
  box-shadow:inset 0 2px 0 var(--red);}
.cbtn:focus-visible{outline:2px solid var(--red); outline-offset:2px;}
.pip{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
.cbtn .wk{font-family:'Bebas Neue',sans-serif; font-size:12px; color:var(--ink3); letter-spacing:0.06em;}

/* Tuiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:9px; margin-top:20px;}
.tile{background:var(--card); border:1px solid var(--border); border-radius:5px; padding:13px 15px;}
.tile .k{font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink3); font-weight:500;}
.tile .v{font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1.05; margin-top:5px; letter-spacing:0.02em;}
.tile .u{font-size:12px; color:var(--ink2); margin-left:3px; font-family:'DM Sans',sans-serif; font-weight:400;}
.tile .d{font-size:11px; color:var(--ink2); margin-top:3px;}

/* Grille de sections */
.duo{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:9px;}
@media(max-width:820px){ .duo{grid-template-columns:1fr;} }
.panel{background:var(--card); border:1px solid var(--border); border-radius:5px; padding:15px 16px 12px;}
.panel h2{font-size:16px; margin:0; letter-spacing:0.08em; text-transform:uppercase;}
.panel .ph{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:2px;}
.panel .phn{font-size:11px; color:var(--ink2);}

/* Graphiques */
.chart{position:relative; margin-top:10px;}
.chart svg{display:block; width:100%; height:auto; overflow:visible;}
.gl{stroke:var(--border); stroke-width:1;}
.ax{fill:var(--ink3); font-size:9.5px; font-family:'DM Sans',sans-serif; font-weight:400;}
.tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--card2); border:1px solid var(--border); border-radius:4px;
  padding:7px 10px; font-size:11.5px; white-space:nowrap; z-index:5;
  box-shadow:0 8px 26px rgba(0,0,0,0.6);}
.tip.on{opacity:1;}
.tip .tw{font-family:'Bebas Neue',sans-serif; font-size:12px; color:var(--ink3); letter-spacing:0.06em;}
.tip .tv{color:var(--ink); font-weight:500;}

/* Petits multiples */
.sm{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:9px; margin-top:10px;}
.smc{background:var(--card2); border:1px solid var(--border); border-radius:4px; padding:10px 11px 7px;}
.smc .l{font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink3); font-weight:500;
  display:flex; align-items:center; gap:6px;}
.smc .n{font-family:'Bebas Neue',sans-serif; font-size:22px; line-height:1.1; margin-top:3px;}
.smc .n span{font-size:11px; color:var(--ink3); font-family:'DM Sans',sans-serif; font-weight:400;}

/* Tableau exercices */
.tbl-wrap{overflow-x:auto; margin-top:10px;}
table{border-collapse:collapse; width:100%; min-width:620px; font-size:13px;}
th{text-align:left; font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink3);
  font-weight:500; padding:0 10px 7px 0; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.ex{font-weight:400; color:var(--ink); line-height:1.35;}
td.ex .sea{display:block; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink3); margin-top:2px;}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:500;
  padding:3px 8px; border-radius:3px; white-space:nowrap; letter-spacing:0.02em;}
.chip.up{background:var(--ok-dim); color:var(--ok);}
.chip.flat{background:rgba(135,124,116,0.13); color:var(--ink2);}
.chip.down{background:var(--red-dim); color:var(--red);}
.chip.new{background:rgba(65,150,223,0.13); color:var(--s2);}
.spark{display:block;}
.flag{display:inline-block; margin-left:7px; font-size:10px; color:var(--warn); cursor:help;
  border-bottom:1px dotted var(--warn);}

/* Notes */
.note{background:var(--card2); border-left:2px solid var(--ink3); border-radius:0 4px 4px 0;
  padding:10px 13px; margin-top:8px; font-size:12.5px; line-height:1.65; color:#cfc7c0;}
.note .m{font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink3);
  font-weight:500; margin-bottom:4px;}
.note.q{border-left-color:var(--red);}
.note.q .m{color:var(--red);}

.empty{color:var(--ink3); font-size:12.5px; font-style:italic; padding:16px 0 10px;}
.sect{margin-top:26px;}
.sect > .eyebrow{margin-bottom:9px; display:block;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink2); margin-top:9px;}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
footer{margin-top:34px; padding-top:14px; border-top:1px solid var(--border); font-size:11px; color:var(--ink3);}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Alexandre Joly · coaching</div>
      <h1>Tableau de bord des coachés<span class="dot">.</span></h1>
      <div class="hsub" id="hsub"></div>
    </div>
    <div class="eyebrow" id="stamp"></div>
  </header>

  <nav class="rail" id="rail" aria-label="Choisir un coaché"></nav>

  <div class="tiles" id="tiles"></div>

  <div class="duo">
    <section class="panel">
      <div class="ph"><h2>Poids</h2><div class="phn" id="pn"></div></div>
      <div class="chart" id="cPoids"></div>
    </section>
    <section class="panel">
      <div class="ph"><h2>Calories</h2><div class="phn" id="cn"></div></div>
      <div class="chart" id="cCal"></div>
    </section>
  </div>

  <div class="sect">
    <span class="eyebrow">Ce qu'il déclare chaque dimanche</span>
    <div class="panel">
      <div class="ph"><h2>Adhérence et récupération</h2><div class="phn">Notes sur 10, semaine par semaine</div></div>
      <div id="adh"></div>
    </div>
  </div>

  <div class="sect">
    <span class="eyebrow">Ce que dit la barre</span>
    <div class="panel">
      <div class="ph"><h2>Progression par exercice</h2><div class="phn">Série la plus lourde de la semaine</div></div>
      <div id="exos"></div>
    </div>
  </div>

  <div class="sect">
    <span class="eyebrow">Ce qu'il écrit</span>
    <div class="panel">
      <div class="ph"><h2>Notes et bilans</h2><div class="phn" id="nn"></div></div>
      <div id="notes"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

/* Un pas de graduation lisible : 1, 2, 5 ou 10 fois une puissance de dix. */
function pasJoli(span, cible){
  const brut=span/cible, mag=Math.pow(10,Math.floor(Math.log10(brut))), n=brut/mag;
  return (n<1.5?1 : n<3?2 : n<7?5 : 10)*mag;
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const jour=s=>{const[d,m,y]=String(s||'').split('/').map(Number); return (d&&m&&y)?new Date(y,m-1,d):null;};
const AUJ=new Date(2026,7,26);
const depuis=s=>{const d=jour(s); return d?Math.round((AUJ-d)/864e5):null;};

/* ---------- Agrégats ---------- */
function serieTop(sets){                      // la série la plus lourde d'une semaine
  let best=null;
  for(const x of sets){
    if(x.kg==null) continue;
    if(!best || x.kg>best.kg || (x.kg===best.kg && (x.r||0)>(best.r||0))) best=x;
  }
  return best;
}
function louche(sets){                        // saisie manifestement inversée
  return sets.some(x=>x.r!=null && x.r>40);
}
function exosDe(c){
  const out=[];
  for(const sea of Object.keys(c.perf)) for(const ex of Object.keys(c.perf[sea])){
    const parSem=c.perf[sea][ex];
    const sems=Object.keys(parSem).map(Number).sort((a,b)=>a-b);
    const pts=[];
    let alerte=false;
    for(const w of sems){
      const sets=parSem[String(w)];
      if(louche(sets)) alerte=true;
      const t=serieTop(sets);
      if(t) pts.push({w, kg:t.kg, r:t.r});
    }
    if(!pts.length) continue;
    const d=pts[pts.length-1];
    const ref=pts[Math.max(0,pts.length-3)];          // 3 dernières semaines saisies
    const delta=+(d.kg-ref.kg).toFixed(1);
    let tend = pts.length<2 ? 'new' : (delta>0.4?'up':(delta<-0.4?'down':'flat'));
    out.push({sea, ex, pts, best:Math.max(...pts.map(x=>x.kg)), delta, tend, alerte,
              dernier:d, nbSem:pts.length});
  }
  const ordre={up:0,new:1,flat:2,down:3};
  out.sort((a,b)=> (ordre[a.tend]-ordre[b.tend]) || a.sea.localeCompare(b.sea) || a.ex.localeCompare(b.ex));
  return out;
}
function semainesRemplies(c){
  const s=new Set();
  for(const sea of Object.keys(c.perf)) for(const ex of Object.keys(c.perf[sea]))
    for(const w of Object.keys(c.perf[sea][ex])) if(c.perf[sea][ex][w].some(x=>x.kg!=null||x.r!=null)) s.add(+w);
  return [...s].sort((a,b)=>a-b);
}
function suiteBilan(c,champ){
  return Object.keys(c.bilan).map(Number).sort((a,b)=>a-b)
    .map(w=>({w, v:c.bilan[String(w)][champ]}))
    .filter(x=>typeof x.v==='number');
}
function suitePoids(c){
  const m=new Map();
  Object.keys(c.poids).forEach(w=>{ if(typeof c.poids[w]==='number') m.set(+w,c.poids[w]); });
  suiteBilan(c,'poids').forEach(x=>m.set(x.w,x.v));
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([w,v])=>({w,v}));
}
function etat(c){
  const j=depuis(c.maj);
  if(c.archive) return {p:INK3, t:'archive'};
  if(j===null) return {p:INK3, t:'—'};
  if(j<=9)  return {p:S.s6, t:'à jour'};
  if(j<=20) return {p:S.s3, t:'en retard'};
  return {p:S.s1, t:'décroché'};
}

/* ---------- Graphiques ---------- */
function ligne(hote, pts, opt){
  const o=Object.assign({couleur:S.s1, unite:'', h:172, deci:1, empanMin:1, pas:1}, opt||{});
  hote.innerHTML='';
  if(!pts.length){ hote.innerHTML='<div class="empty">Rien de saisi pour le moment.</div>'; return; }
  const W=520, H=o.h, ml=40, mr=14, mt=14, mb=26;
  const xs=pts.map(p=>p.w), ys=pts.map(p=>p.v);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  /* Un empan minimal : sans ça, 600 g de variation de poids remplissent
     tout le cadre et le bruit du matin ressemble à une tendance. */
  const empan=o.empanMin||1, mid=(hi+lo)/2;
  if(hi-lo<empan){ lo=mid-empan/2; hi=mid+empan/2; }
  else { const pad=(hi-lo)*0.16; lo-=pad; hi+=pad; }
  /* Graduations rondes plutôt que 3048 / 2916 / 2784 */
  const pas=pasJoli(hi-lo, 3.5);
  lo=Math.floor(lo/pas)*pas; hi=Math.ceil(hi/pas)*pas;
  if(hi<=lo) hi=lo+pas;
  const nbT=Math.min(6, Math.round((hi-lo)/pas)+1);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const px=w=> ml + (x1===x0?0.5:(w-x0)/(x1-x0))*(W-ml-mr);
  const py=v=> mt + (1-(v-lo)/(hi-lo))*(H-mt-mb);
  const uid='g'+Math.random().toString(36).slice(2,8);

  let g='';
  for(let i=0;i<nbT;i++){ const v=hi-i*(hi-lo)/(nbT-1); const y=py(v);
    g+=`<line class="gl" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    g+=`<text class="ax tnum" x="${ml-7}" y="${(y+3.2).toFixed(1)}" text-anchor="end">${(+v.toFixed(4)).toFixed(o.deci)}</text>`;
  }
  const d=pts.map((p,i)=>`${i?'L':'M'}${px(p.w).toFixed(1)},${py(p.v).toFixed(1)}`).join(' ');
  const aire=`${d} L${px(pts[pts.length-1].w).toFixed(1)},${(H-mb).toFixed(1)} L${px(pts[0].w).toFixed(1)},${(H-mb).toFixed(1)} Z`;
  const dern=pts[pts.length-1];

  hote.innerHTML=`
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${pts.length} semaines">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${o.couleur}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${o.couleur}" stop-opacity="0"/>
    </linearGradient></defs>
    ${g}
    <path d="${aire}" fill="url(#${uid})"/>
    <path d="${d}" fill="none" stroke="${o.couleur}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${px(p.w).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="3.4" fill="${o.couleur}" stroke="var(--card)" stroke-width="2"/>`).join('')}
    <circle cx="${px(dern.w).toFixed(1)}" cy="${py(dern.v).toFixed(1)}" r="5.4" fill="${o.couleur}" stroke="var(--card)" stroke-width="2.4"/>
    ${pts.map(p=>`<text class="ax tnum" x="${px(p.w).toFixed(1)}" y="${H-8}" text-anchor="middle">S${p.w}</text>`).join('')}
    <line id="${uid}-cr" x1="0" y1="${mt}" x2="0" y2="${H-mb}" stroke="${INK2}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    <rect x="${ml}" y="0" width="${W-ml-mr}" height="${H}" fill="transparent" id="${uid}-hit"/>
  </svg>
  <div class="tip" id="${uid}-tip"></div>`;

  const svg=hote.querySelector('svg'), cr=hote.querySelector(`#${uid}-cr`), tip=hote.querySelector(`#${uid}-tip`);
  const bouge=e=>{
    const b=svg.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const vx=(cx-b.left)/b.width*W;
    let m=pts[0], dm=1e9;
    pts.forEach(p=>{const dd=Math.abs(px(p.w)-vx); if(dd<dm){dm=dd;m=p;}});
    cr.setAttribute('x1',px(m.w)); cr.setAttribute('x2',px(m.w)); cr.setAttribute('opacity','1');
    tip.className='tip on';
    tip.innerHTML=`<span class="tw">Semaine ${m.w}</span> &nbsp;<span class="tv">${m.v}${o.unite}</span>`;
    const l=px(m.w)/W*b.width;
    tip.style.left=Math.max(4,Math.min(b.width-tip.offsetWidth-4,l-tip.offsetWidth/2))+'px';
    tip.style.top=(py(m.v)/H*b.height-tip.offsetHeight-10)+'px';
  };
  svg.addEventListener('mousemove',bouge);
  svg.addEventListener('touchmove',e=>{bouge(e);},{passive:true});
  svg.addEventListener('mouseleave',()=>{cr.setAttribute('opacity','0'); tip.className='tip';});
}

function sparkline(pts, couleur){
  if(pts.length<2){
    return `<svg class="spark" width="94" height="26" aria-hidden="true"><circle cx="47" cy="13" r="3" fill="${couleur}"/></svg>`;
  }
  const W=94,H=26,m=4;
  const ys=pts.map(p=>p.kg); let lo=Math.min(...ys), hi=Math.max(...ys);
  if(hi===lo){hi=lo+1;lo=lo-1;}
  const px=i=> m+(i/(pts.length-1))*(W-2*m);
  const py=v=> m+(1-(v-lo)/(hi-lo))*(H-2*m);
  const d=pts.map((p,i)=>`${i?'L':'M'}${px(i).toFixed(1)},${py(p.kg).toFixed(1)}`).join(' ');
  const li=pts.length-1;
  return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${couleur}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="${px(li).toFixed(1)}" cy="${py(pts[li].kg).toFixed(1)}" r="2.8" fill="${couleur}"/>
  </svg>`;
}

        const dep=x.pts[0];
        return `<tr>
          <td class="ex">${esc(x.ex)}${x.alerte?'<span class="flag" title="Une série dépasse 40 répétitions : les kg et les reps ont sans doute été saisis à l\'envers.">saisie douteuse</span>':''}<span class="sea">${esc(x.sea)}</span></td>
          <td><span class="chip ${x.tend}">${lib[x.tend]}${x.tend==='up'||x.tend==='down'?` ${x.delta>0?'+':''}${x.delta} kg`:''}</span></td>
          <td>${sparkline(x.pts,col)}</td>
          <td class="tnum" style="color:var(--ink2)">${dep.kg} × ${dep.r??'—'}</td>
          <td class="tnum">${x.dernier.kg} × ${x.dernier.r??'—'}</td>
          <td class="tnum" style="color:var(--ink2)">${x.best} kg</td>
          <td class="tnum" style="color:var(--ink3)">${x.nbSem}</td>
        </tr>`;
      }).join('')+'</tbody></table></div>';
  }

  /* Notes et bilans */
  const nb=document.getElementById('notes');
  const items=[];
  Object.keys(c.bilan).map(Number).sort((a,b)=>b-a).forEach(w=>{
    const b=c.bilan[String(w)];
    [['ressenti','Ressenti des séances'],['difficultes','Difficultés'],['modifs','Modifications demandées'],['question','Question pour le coach']]
      .forEach(([k,l])=>{ if(typeof b[k]==='string' && b[k].trim())
        items.push({w, m:`Semaine ${w} · ${l}`, t:b[k], q:k==='question'}); });
  });
  c.notes.slice().sort((a,b)=>b.w-a.w).forEach(n=>items.push({w:n.w, m:`Semaine ${n.w} · ${n.s}`, t:n.t}));
  items.sort((a,b)=>b.w-a.w);
  document.getElementById('nn').textContent = items.length?`${items.length} entrées`:'';
  nb.innerHTML = items.length
    ? items.map(i=>`<div class="note${i.q?' q':''}"><div class="m">${esc(i.m)}</div>${esc(i.t)}</div>`).join('')
    : '<div class="empty">Aucune note de séance ni bilan écrit.</div>';

  document.getElementById('foot').innerHTML =
    `Lecture directe du tableau SUIVI FINAL. La tendance compare la série la plus lourde de la dernière semaine saisie à celle d'il y a trois semaines, `
    + `pas au tout début : sinon un changement de salle passe pour une progression. Au-delà de 400 g d'écart on parle de montée ou de baisse. `
    + `Les graphiques gardent un empan minimal pour que le bruit du matin ne ressemble pas à une tendance. `
    + `Et une chute de charge pendant qu'un exercice voisin monte veut souvent dire changement de machine, pas régression : lire les notes avant de conclure.`;
}

rail(); dessine();

</script>
